# Help-only sufficiency arm: seven representative jira-as tasks.
#
# The model gets nothing but skills/jira/SKILL.md (the Entry-Point Hint),
# the Bash tool, and a `jira-as` on PATH running in `simulation` transport
# with no credentials. Each task is one line of plain English -- there is
# no expected output or business-content assertion here; see
# tests/e2e/runner.py for how a trial is judged (the last jira-as command
# the model ran must be accepted by the CLI when replayed).
metadata:
  name: jira-sufficiency-arm
  description: Help-only sufficiency arm for the jira skill
  version: 5.0.0

tasks:
  - id: search-jql
    prompt: Search Jira for issues using a JQL query.
  - id: read-issue
    prompt: Read the details of one Jira issue.
  - id: create-issue
    prompt: >-
      Create an issue in a Jira project. A preview is enough -- you do not
      need to confirm or send it.
  - id: add-comment
    prompt: Add a comment to a Jira issue.
  - id: transition-issue
    prompt: Transition a Jira issue to a named status.
  - id: log-work
    prompt: Log two hours of work on a Jira issue.
  - id: find-watchers-operation
    prompt: Find and describe the operation that lists a Jira issue's watchers.
