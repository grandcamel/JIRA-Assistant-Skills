# This project is a Claude Code plugin (documentation only)
# The CLI is now distributed via jira-as
# This file provides development tooling configuration

[project]
name = "jira-assistant-skills-plugin"
version = "4.3.0"
description = "Claude Code plugin for JIRA automation - provides skill documentation for the jira-as CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

# CLI is installed via the library
dependencies = [
    "jira-as>=1.1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.8.0",
]

# Tell setuptools this is a documentation-only project with no packages
[tool.setuptools]
packages = []

# =============================================================================
# Ruff - Fast Python linter and formatter
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88
# Newer ruff releases format Python code blocks inside Markdown; this repo's
# docs are prose-first, so keep ruff scoped to real Python files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =============================================================================
# Bandit - Plugin test and evaluation tooling (all skills/ and tests/ Python)
# =============================================================================
[tool.bandit]
# Reviewed JAS-66 baseline; keep all paths and the default severity threshold.
# These rule exceptions also suppress future instances; all other rules gate CI.
skips = [
    "B101",  # Pytest assertions express test expectations.
    "B110",  # Best-effort test cleanup, readiness polling and telemetry metadata.
    "B310",  # Test connectivity to the configured OTLP endpoint/local Jira container.
    "B311",  # Random test identifiers, not security tokens.
    "B404",  # Subprocess imports are required by CLI/model test harnesses.
    "B405",  # ElementTree constructs JUnit XML; it does not parse input XML.
    "B603",  # Harness argument-list subprocesses; shell=True remains checked.
    "B607",  # Test harnesses resolve installed git/claude commands through PATH.
]
