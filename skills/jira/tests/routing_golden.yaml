# Golden prompt set for the two-skill routing check.
#
# One skill per plugin retires intra-plugin disambiguation (there is no
# longer a hub choosing among thirteen domain skills). What test_routing.py
# now checks is inter-plugin discrimination: with the `jira` skill from
# this plugin and the `confluence` skill from the non-shipped
# tests/fixtures/confluence-stub/ fixture both installed, does Claude Code
# load the right one (or neither, for unrelated prompts)?
#
# expected_skill: "jira" | "confluence" | null (null = should load neither)
version: "2.0"
tests:
  - id: jira-01
    input: "Search Jira for all open bugs assigned to me in the PROJ project"
    expected_skill: jira
  - id: jira-02
    input: "Create a new Jira issue: a bug titled 'Login button unresponsive on Safari'"
    expected_skill: jira
  - id: jira-03
    input: "Transition Jira issue PROJ-123 to Done"
    expected_skill: jira
  - id: jira-04
    input: "Log two hours of work on Jira ticket PROJ-456"
    expected_skill: jira
  - id: confluence-01
    input: "Create a new Confluence page called 'Sprint Retro Notes' in the Engineering space"
    expected_skill: confluence
  - id: confluence-02
    input: "Find the Confluence page about our onboarding process"
    expected_skill: confluence
  - id: confluence-03
    input: "Update the Confluence space permissions for the Marketing team"
    expected_skill: confluence
  - id: confluence-04
    input: "Summarize the content of our Confluence architecture decision records"
    expected_skill: confluence
  - id: neither-01
    input: "What's the weather like in Paris today?"
    expected_skill: null
  - id: neither-02
    input: "Write a haiku about autumn leaves falling in a quiet park"
    expected_skill: null
